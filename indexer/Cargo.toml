[package]
name = "warden-indexer"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-rpc-client = "27.0.0"
stellar-xdr = { version = "27.0.0", features = ["std", "serde", "base64"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
